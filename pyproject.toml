[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-palettes"
version = "2.0.0"
description = "184 publication-ready colour schemes for SCI figures - 6 published palettes plus 178 audited variants, scored for basic research, clinical research and database/registry work."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xiong-ding-kan", email = "xjp0429@126.com" }]
keywords = ["color", "palette", "scientific", "matplotlib", "visualization", "SCI", "配色"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["matplotlib>=3.5", "pytest>=7"]

[project.scripts]
sci-palettes = "sci_palettes.cli:main"

[project.urls]
Homepage = "https://github.com/Xiong-ding-kan/sci-color-palettes"

[tool.setuptools]
package-dir = { "" = "scripts" }
packages = ["sci_palettes"]
# the generated palette library and the field scores are data files the package
# loads at runtime; without this they are missing from an installed wheel
include-package-data = true

[tool.setuptools.package-data]
sci_palettes = ["derived.json", "applications.json"]
